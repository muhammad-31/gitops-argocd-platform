# One Application per folder under apps/. Adding a service = adding a folder
# with values files; no Argo CD changes needed.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/muhammad-31/gitops-argocd-platform.git
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: "{{ .path.basename }}"
      labels:
        layer: apps
    spec:
      project: apps
      source:
        repoURL: https://github.com/muhammad-31/gitops-argocd-platform.git
        targetRevision: main
        path: charts/web-app
        helm:
          releaseName: "{{ .path.basename }}"
          ignoreMissingValueFiles: true
          valueFiles:
            - ../../{{ .path.path }}/values.yaml
            - ../../{{ .path.path }}/values-dev.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # Labels drive policy: Kyverno policies select workload-tier=apps and
        # Pod Security Admission enforces the restricted standard.
        managedNamespaceMetadata:
          labels:
            workload-tier: apps
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
