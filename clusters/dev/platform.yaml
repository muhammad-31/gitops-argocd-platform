# Third-party add-ons installed from their upstream Helm charts. Chart versions
# are pinned here; values live next to each component under platform/<name>/.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: cert-manager
            namespace: cert-manager
            repoURL: https://charts.jetstack.io
            chart: cert-manager
            version: v1.21.1
          - name: kyverno
            namespace: kyverno
            repoURL: https://kyverno.github.io/kyverno/
            chart: kyverno
            version: 3.9.1
          - name: envoy-gateway
            namespace: envoy-gateway-system
            repoURL: docker.io/envoyproxy
            chart: gateway-helm
            version: v1.9.1
          - name: metrics-server
            namespace: kube-system
            repoURL: https://kubernetes-sigs.github.io/metrics-server/
            chart: metrics-server
            version: 3.14.0
  template:
    metadata:
      name: "{{ .name }}"
      labels:
        layer: platform
    spec:
      project: platform
      sources:
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .version }}"
          helm:
            releaseName: "{{ .name }}"
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/platform/{{ .name }}/values.yaml
              - $values/platform/{{ .name }}/values-dev.yaml
        - repoURL: https://github.com/muhammad-31/gitops-argocd-platform.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
      # Controllers such as Kyverno inject the CA bundle into their CRDs'
      # conversion webhooks at runtime; that field is not owned by Git.
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.conversion.webhook.clientConfig.caBundle
