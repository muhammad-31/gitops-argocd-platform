crds:
  enabled: true
  # Keep CRDs (and therefore every Certificate) if the release is removed.
  keep: true

resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {memory: 256Mi}

webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

cainjector:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}
