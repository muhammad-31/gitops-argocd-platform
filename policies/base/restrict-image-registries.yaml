apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict image registries
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Application pods may only pull images from approved repositories: your
      own organisation's namespaces, not whole public registries. Images must be
      fully qualified (registry/repository:tag) so the source is explicit.
      Edit allowedPrefixes for your organisation (GHCR namespace, ECR account).
spec:
  validationActions: [Audit]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        workload-tier: apps
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image)
        + (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, c.image) : [])
    # Each entry ends in "/" so lookalike hosts and sibling namespaces
    # (ghcr.io/someone-else/...) never match.
    #   ghcr.io/muhammad-31/   this organisation's images
    #   ghcr.io/stefanprodan/  podinfo, the sample workload
    #   docker.io/library/     Docker Official Images
    #   123456789012...        your private ECR registry (one account, one region)
    - name: allowedPrefixes
      expression: >-
        ['ghcr.io/muhammad-31/', 'ghcr.io/stefanprodan/', 'docker.io/library/',
        '123456789012.dkr.ecr.us-east-1.amazonaws.com/']
    - name: rejected
      expression: >-
        variables.images.filter(i, !variables.allowedPrefixes.exists(p, i.startsWith(p)))
  validations:
    - expression: size(variables.rejected) == 0
      messageExpression: >-
        'images from unapproved repositories: ' + variables.rejected.join(', ')
        + ' (allowed prefixes: ' + variables.allowedPrefixes.join(', ') + ')'
